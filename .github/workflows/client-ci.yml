name: Client CI

on:
  push:
    paths:
      - "packages/client/**"
      - "packages/shared/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "packages/client/**"
      - "packages/shared/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: |
          pip install -e packages/shared
          pip install -e "packages/client[dev]"
      - name: Lint
        run: ruff check packages/client packages/shared
      - name: Test
        run: pytest packages/client packages/shared
