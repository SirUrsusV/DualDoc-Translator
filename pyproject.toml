[project]
name = "dualdoc-translator"
version = "0.1.0"
description = "Monorepo workspace for DualDoc Translator"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
python_files = ["test_*.py"]
