services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dualdoc
      POSTGRES_USER: dualdoc
      POSTGRES_PASSWORD: dualdoc
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./packages/backend
    depends_on: [db, redis]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://dualdoc:dualdoc@db:5432/dualdoc
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./packages/backend:/app
      - ./packages/shared:/shared

volumes:
  pgdata:
